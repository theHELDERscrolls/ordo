name: CI

# Runs on every PR to develop or main, and on pushes to those branches.
# This covers both hops of the flow: feature -> develop  and  develop -> main.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Cancel older in-progress runs for the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal default permissions (security best practice).
permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # One install at the root covers all workspaces (single lockfile).
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
