openapi: 3.1.0
info:
  title: Ordo API
  version: 0.1.0
  description: >-
    REST API for Ordo, a configurable inventory platform for small businesses.
    All endpoints except POST /auth/login and GET /health require a Bearer token
    issued by login. Inventory endpoints are scoped to the caller's business.
servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Products
  - name: Movements
  - name: Dashboard

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness check
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and open a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: admin@tallerrodri.com }
                password: { type: string, example: ordo1234! }
      responses:
        '200':
          description: Token plus the resolved tenant context
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
                  business: { $ref: '#/components/schemas/Business' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user and business
      responses:
        '200':
          description: The authenticated user and their business
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  business: { $ref: '#/components/schemas/Business' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /products:
    get:
      tags: [Products]
      summary: List products
      parameters:
        - { name: search, in: query, schema: { type: string }, description: Matches name or SKU }
        - { name: stockStatus, in: query, schema: { type: string, enum: [in, low, out] } }
        - { name: category, in: query, schema: { type: string } }
        - { name: supplier, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [name, stock, salePrice, createdAt], default: name } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: A page of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Products]
      summary: Create a product (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: The created product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A product with this SKU already exists in the business
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /products/facets:
    get:
      tags: [Products]
      summary: Distinct categories and suppliers for the filters
      responses:
        '200':
          description: Facet values for the caller's business
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductFacets' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /products/export.csv:
    get:
      tags: [Products]
      summary: Export the inventory as CSV
      description: >-
        Honours the same filters and sort as GET /products and ignores pagination:
        you export what you are looking at. Written the way a Spanish Excel expects
        it — `;`, comma decimals and a UTF-8 BOM — so it opens in columns on a double
        click. The file re-imports as a no-op.
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: stockStatus, in: query, schema: { type: string, enum: [in, low, out] } }
        - { name: category, in: query, schema: { type: string } }
        - { name: supplier, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [name, stock, salePrice, createdAt], default: name } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
      responses:
        '200':
          description: The inventory as a CSV attachment
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="ordo-inventario-2026-08-21.csv"
          content:
            text/csv:
              schema: { type: string }
              example: |
                sku;name;category;supplier;unit;stock;minStock;costPrice;salePrice;description
                ACE-001;Aceite motor 5W-30 5L;Aceites y lubricantes;Castrol;unidad;67;10;22,8;38;
        '401': { $ref: '#/components/responses/Unauthorized' }

  /products/import:
    post:
      tags: [Products]
      summary: Bulk load the catalogue from a CSV (admin only)
      description: >-
        Upserts by (businessId, sku). Only the columns the file fills are written,
        so a missing or empty cell leaves that field alone. The delimiter (`;` or
        `,`) is detected from the header and a decimal may be written either way,
        because Excel writes the convention of its locale. An invalid row is
        reported with its line number and skipped, never aborting the file.
      parameters:
        - name: dryRun
          in: query
          schema: { type: boolean, default: true }
          description: Validate and report without writing anything
        - name: quantityMode
          in: query
          schema: { type: string, enum: [set, add], default: set }
          description: Whether the stock column replaces the stock or is added to it
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
            example: |
              sku;name;category;supplier;unit;stock;minStock;costPrice;salePrice;description
              ACE-001;Aceite motor 5W-30 5L;Aceites y lubricantes;Castrol;unidad;25;10;22,8;38;
      responses:
        '200':
          description: What the import did, or would do on a dry run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: The file is over the 1 MB limit
        '415':
          description: The body was not sent as text/csv
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /products/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Products]
      summary: Get a product by id
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Products]
      summary: Update a product (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ProductInput'
              description: Any subset of the creatable fields
      responses:
        '200':
          description: The updated product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Products]
      summary: Delete a product (admin only)
      responses:
        '204': { description: Deleted (no content) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /movements:
    get:
      tags: [Movements]
      summary: List stock movements, newest first
      parameters:
        - { name: productId, in: query, schema: { type: string }, description: Only this product's history }
        - { name: type, in: query, schema: { type: string, enum: [in, out, adjust] } }
        - { name: from, in: query, schema: { type: string, format: date }, description: Inclusive lower bound on createdAt }
        - { name: to, in: query, schema: { type: string, format: date }, description: Inclusive upper bound; a bare date covers the whole day }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: A page of movements
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Movement' }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Movements]
      summary: Record an entry or an exit (admin only)
      description: >-
        Only `in` and `out` are accepted. An `adjust` is written by the system when
        a correction arrives through another path, so it cannot be posted here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovementInput' }
      responses:
        '201':
          description: The recorded movement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The exit exceeds the stock available
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Inventory snapshot for the dashboard
      responses:
        '200':
          description: The inventory stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  productCount: { type: integer }
                  lowStockCount: { type: integer }
                  outOfStockCount: { type: integer }
                  inventoryValue: { type: number }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /dashboard/inventory-breakdown:
    get:
      tags: [Dashboard]
      summary: Where the inventory's capital sits, for the panel's charts
      responses:
        '200':
          description: Value per category and the products ranked by value
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalValue: { type: number }
                  productCount: { type: integer }
                  byCategory:
                    type: array
                    items:
                      type: object
                      properties:
                        category:
                          type: string
                          description: Empty for products with no category
                        value: { type: number }
                        productCount: { type: integer }
                  topProducts:
                    type: array
                    description: Highest value first, capped at 20, zero-value excluded
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        sku: { type: string }
                        value: { type: number }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not allowed (admin role required)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found, or not in the caller's business
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Branding:
      type: object
      properties:
        accentColor: { type: string, example: '#d62828' }
        logoUrl: { type: string, format: uri }
        faviconUrl: { type: string, format: uri }
    Business:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        branding: { $ref: '#/components/schemas/Branding' }
    User:
      type: object
      properties:
        id: { type: string }
        businessId: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [admin, employee] }
    Product:
      type: object
      properties:
        id: { type: string }
        businessId: { type: string }
        name: { type: string }
        sku: { type: string }
        description: { type: string }
        category: { type: string }
        supplier: { type: string }
        unit: { type: string }
        stock: { type: number }
        minStock: { type: number }
        costPrice: { type: number }
        salePrice: { type: number }
        stockStatus: { type: string, enum: [in, low, out] }
    ProductInput:
      type: object
      required: [name, sku, unit]
      properties:
        name: { type: string }
        sku: { type: string }
        unit: { type: string }
        description: { type: string }
        category: { type: string }
        supplier: { type: string }
        stock: { type: number, default: 0 }
        minStock: { type: number, default: 0 }
        costPrice: { type: number, default: 0 }
        salePrice: { type: number, default: 0 }
    Movement:
      type: object
      properties:
        id: { type: string }
        businessId: { type: string }
        productId: { type: string }
        productName: { type: string }
        productSku: { type: string }
        type: { type: string, enum: [in, out, adjust] }
        quantity: { type: number, description: Always positive; the sign lives in type }
        resultingStock: { type: number, description: The product's stock after this movement }
        reason: { type: string }
        userId: { type: string }
        userName: { type: string }
        createdAt: { type: string, format: date-time }
    MovementInput:
      type: object
      required: [productId, type, quantity]
      properties:
        productId: { type: string }
        type: { type: string, enum: [in, out] }
        quantity: { type: number, exclusiveMinimum: 0 }
        reason: { type: string, maxLength: 120 }
    ImportResult:
      type: object
      properties:
        dryRun: { type: boolean }
        total: { type: integer, description: Data rows read from the file }
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer, description: Rows reported in errors }
        errors:
          type: array
          items:
            type: object
            properties:
              row: { type: integer, description: The line in the file, the header being line 1 }
              sku: { type: string }
              message: { type: string }
    ProductFacets:
      type: object
      properties:
        categories:
          type: array
          items: { type: string }
        suppliers:
          type: array
          items: { type: string }

security:
  - bearerAuth: []
